<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Information</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        nav h1 {
            margin: 0;
            font-size: 1.8rem;
            font-family: 'Helvetica Neue', sans-serif;
            font-weight: 100;
        }
        nav div {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        nav img {
            height: 40px;
            margin-top: 5px;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        nav ul li {
            margin-left: 20px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        nav ul li a:hover {
            text-decoration: underline;
        }
        .hero {
            background-image: url('https://via.placeholder.com/1920x600?text=Hero+Image'); /* Replace with actual image */
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding-top: 80px; /* Account for fixed header */
        }
        .hero h2 {
            font-size: 3rem;
            margin: 0;
        }
        .hero p {
            font-size: 1.5rem;
            margin: 20px 0;
        }
        .btn {
            background-color: #87CEEB;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #4682B4;
        }
        section {
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .about, .services, .shop, .contact {
            text-align: center;
        }
        .portfolio {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .portfolio img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
        }
        .services-grid {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .service {
            width: 300px;
            margin: 20px;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .print {
            border: 1px solid #ddd;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
        }
        .print img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }
        form {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }
        form input, form textarea {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div>
                <h1>Captured By Cole</h1>
                <img src="img.jpg" alt="Logo">
            </div>
            <ul>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="prints.html">Prints</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact">
        <h1>Contact Information</h1>
        <p>capturedbycolej@gmail.com</p>
    </section>

    <footer>
        <p>&copy; 2026 Captured By Cole. All rights reserved.</p>
    </footer>
</body>
</html>
